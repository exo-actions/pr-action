name: "PR BUILD"
description: "This action builds Maven projects with partial build support"
author: "eXo Platform"
runs:
  using: "node20"
  main: "dist/index.js"
inputs:
  maven_version:
    description: "Maven version"
    default: "3.9.11"
    required: false
  maven_profiles:
    description: "Maven profiles"
    default: "default"
    required: false
  extra_maven_opts:
    description: "Extra Maven options"
    required: false
  jdk_major_version:
    description: "JDK Major version (e.g., 8, 11, 17, 21)"
    default: "17"
    required: false
  jdk_distribution:
    description: "JDK distribution (temurin, zulu, adopt, liberica)"
    default: "zulu"
    required: false
  maximize_build_space:
    description: "Maximize build space for bigger projects"
    default: "false"
    required: false
  NEXUS_USERNAME:
    description: "Maven Nexus username"
    required: false
  NEXUS_PASSWORD:
    description: "Maven Nexus password"
    required: false
  GH_TOKEN:
    description: "GitHub token (defaults to github.token)"
    required: false
  M2_SETTINGS_FILE_URL:
    description: "Maven settings.xml file URL"
    required: false
  GIT_CHECKOUT_SHOW_PROGRESS:
    description: "Show git checkout progress"
    default: "false"
    required: false
branding:
  icon: "anchor"
  color: "gray-dark"
